<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/png" href="./assets/64px-Poké_Ball_icon.svg.png">
</head>

<body onload="init()">
    <header class="content-header">
        <section>
            <img class="img-header" src="./assets/Pokédex_logo.png" alt="Überschrift">
            <div>
                <form id="search-form" action="">
                    <input id="search-input" placeholder="Pokémon suchen" type="text">
                    <button type="button" id="search-btn" onclick="searchPokemon()">search</button>
                </form>
            </div>

        </section>
    </header>
    <main>
        <div id="content"></div>
        <button onclick="renderPokemon()" id="load-more">Load More</button>

    </main>
    <footer>

    </footer>




    <div id="loading-spinner">
        <div class="pokeball"></div>
    </div>


</body>
<dialog id="pokemon-dialog">
    <div class="dialog-content">



    </div>
</dialog>
<script src="script.js"></script>
<script src="template.js"></script>

</html>
